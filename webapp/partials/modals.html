<!-- ==================== SETTINGS MODAL ==================== -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-sm">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-700/80 rounded-t-3xl p-5 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-white">⚙️ Настройки</h2>
      <button id="btnCloseSettings"
        class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 active:scale-95 transition-all">✕</button>
    </div>
    <!-- Toggle: Уведомления о парах -->
    <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/40">
      <div>
        <div class="font-semibold text-sm text-white">🔔 Уведомления о парах</div>
        <div class="text-xs text-slate-400 mt-0.5">Напоминание за 5 мин до конца пары</div>
      </div>
      <button id="toggleNotifications"
        class="w-12 h-6 rounded-full transition-colors duration-200 bg-slate-600 relative flex-shrink-0">
        <span id="toggleNotificationsThumb"
          class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-200"></span>
      </button>
    </div>
    <!-- Toggle: MOOK (показывается только при включённых уведомлениях) -->
    <div id="mookToggleRow"
      class="flex items-center justify-between p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/40">
      <div>
        <div class="font-semibold text-sm text-white">📱 Пары MOOK (дистант)</div>
        <div class="text-xs text-slate-400 mt-0.5">Уведомления для онлайн-пар</div>
      </div>
      <button id="toggleMook"
        class="w-12 h-6 rounded-full transition-colors duration-200 bg-slate-600 relative flex-shrink-0">
        <span id="toggleMookThumb"
          class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-200"></span>
      </button>
    </div>
    <!-- Тема оформления (Accent Theme) -->
    <div class="p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/40 space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="font-semibold text-sm text-white">🎨 Тема оформления</div>
        <span id="currentThemeName" class="text-xs text-slate-400">Изумруд</span>
      </div>
      <div class="flex items-center justify-between pt-1 px-1" id="themeSelectorContainer">
        <!-- Emerald -->
        <button type="button" data-theme-btn="emerald"
          class="theme-choice-btn flex flex-col items-center space-y-1 active:scale-90 transition-transform cursor-pointer"
          title="Изумруд">
          <span
            class="pointer-events-none w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center ring-2 ring-emerald-400 shadow-lg shadow-emerald-500/20">
            <svg class="pointer-events-none w-4 h-4 text-white theme-check-icon" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span class="pointer-events-none text-[10px] text-white font-medium">Изумруд</span>
        </button>
        <!-- Ocean -->
        <button type="button" data-theme-btn="ocean"
          class="theme-choice-btn flex flex-col items-center space-y-1 active:scale-90 transition-transform cursor-pointer"
          title="Океан">
          <span
            class="pointer-events-none w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-cyan-400 flex items-center justify-center ring-0 ring-sky-400">
            <svg class="pointer-events-none w-4 h-4 text-white hidden theme-check-icon" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span class="pointer-events-none text-[10px] text-slate-400 font-medium">Океан</span>
        </button>
        <!-- Purple -->
        <button type="button" data-theme-btn="purple"
          class="theme-choice-btn flex flex-col items-center space-y-1 active:scale-90 transition-transform cursor-pointer"
          title="Неон">
          <span
            class="pointer-events-none w-8 h-8 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-400 flex items-center justify-center ring-0 ring-purple-400">
            <svg class="pointer-events-none w-4 h-4 text-white hidden theme-check-icon" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span class="pointer-events-none text-[10px] text-slate-400 font-medium">Неон</span>
        </button>
        <!-- Sunset -->
        <button type="button" data-theme-btn="sunset"
          class="theme-choice-btn flex flex-col items-center space-y-1 active:scale-90 transition-transform cursor-pointer"
          title="Закат">
          <span
            class="pointer-events-none w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-orange-400 flex items-center justify-center ring-0 ring-amber-400">
            <svg class="pointer-events-none w-4 h-4 text-white hidden theme-check-icon" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span class="pointer-events-none text-[10px] text-slate-400 font-medium">Закат</span>
        </button>
        <!-- OLED -->
        <button type="button" data-theme-btn="oled"
          class="theme-choice-btn flex flex-col items-center space-y-1 active:scale-90 transition-transform cursor-pointer"
          title="OLED Черный">
          <span
            class="pointer-events-none w-8 h-8 rounded-full bg-gradient-to-tr from-black to-slate-800 border border-slate-600 flex items-center justify-center ring-0 ring-white">
            <svg class="pointer-events-none w-4 h-4 text-white hidden theme-check-icon" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span class="pointer-events-none text-[10px] text-slate-400 font-medium">OLED</span>
        </button>
      </div>
    </div>
    <!-- Политика конфиденциальности -->
    <button id="btnPrivacyPolicy"
      class="w-full text-left p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/40 text-sm font-semibold text-slate-200 active:scale-[0.98] transition-all flex items-center space-x-2">
      <span>🛡️</span><span>Политика конфиденциальности</span>
    </button>
    <!-- Удалить данные -->
    <button id="btnDeleteAccount"
      class="w-full text-left p-3.5 rounded-xl bg-red-950/40 border border-red-800/40 text-sm font-semibold text-red-400 active:scale-[0.98] transition-all flex items-center space-x-2">
      <span>🗑️</span><span>Удалить все мои данные</span>
    </button>
  </div>
</div>

<!-- ==================== PRIVACY POLICY MODAL ==================== -->

            проекта</div>
          <div class="text-[11px] text-slate-400">github.com/kaialish/tou_bot</div>
        </div>
      </div>
      <svg class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors flex-shrink-0" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

  </div>
</div>
